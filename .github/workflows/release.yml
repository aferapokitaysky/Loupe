name: release

# Pushing a version tag (git flow release finish does this) builds, tests and publishes the
# downloads - nobody should need Visual Studio and the Npcap SDK just to try the app.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath third_party/npcap-sdk

      - name: Build native capture engine
        shell: cmd
        env:
          NPCAP_SDK_DIR: ${{ github.workspace }}\third_party\npcap-sdk
        run: |
          msbuild native\Loupe.Native\Loupe.Native.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%GITHUB_WORKSPACE%\ /v:minimal

      - name: Run tests
        run: dotnet run --project tests\Loupe.Tests -c Release

      # Two flavours. The headline download is one file: the runtime and the native capture
      # library travel inside the exe, so there is nothing to unpack and no console window
      # behind the app. The second is for machines that already have .NET 8 and want the small
      # download. Npcap is never bundled - its licence does not allow redistribution, and the
      # app offers to fetch the official installer.
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $app = "src\Loupe.App\Loupe.App.csproj"

          dotnet publish $app -c Release -r win-x64 --self-contained true -p:Version=$version `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out\single
          dotnet publish $app -c Release -r win-x64 --self-contained false -p:Version=$version -o out\framework

          if (-not (Test-Path "out\single\Loupe.exe")) { throw "the single-file build produced no exe" }
          if (-not (Test-Path "out\framework\Loupe.Native.dll")) { throw "Loupe.Native.dll missing from the framework build" }

          Copy-Item LICENSE, README.md, README.ru.md out\single
          Copy-Item LICENSE, README.md, README.ru.md out\framework

          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out\single\Loupe.exe "dist\Loupe-$version.exe"
          Compress-Archive -Path out\single\* -DestinationPath "dist\Loupe-$version-win-x64.zip"
          Compress-Archive -Path out\framework\* -DestinationPath "dist\Loupe-$version-win-x64-net8.zip"

          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Loupe ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
