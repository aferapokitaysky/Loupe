name: Feature request
description: Something Loupe could do better or does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to see or do
      description: The situation, not only the feature - there may be a simpler way to get there.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
